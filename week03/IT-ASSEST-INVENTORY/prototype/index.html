  --ok: #4fc58c; --warn: #e2a640; --bad: #ff6d61; --idle: #8f9aa6; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-ui); }
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
.rail { background: var(--rail); color: var(--rail-ink); padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px;
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px; }
.brand { font: 600 15px/1.2 var(--font-head); letter-spacing: .01em; }
.brand small { display: block; font: 400 12px var(--font-ui); color: var(--rail-muted); margin-top: 2px; }
.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail a { color: var(--rail-ink); text-decoration: none; padding: 7px 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }

.rail a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }

.rail .who { margin-top: auto; font-size: 12px; color: var(--rail-muted); }
.rail .who b { display: block; color: var(--rail-ink); font-weight: 500; }
main { min-width: 0; padding-block: 20px 48px; padding-left: max(16px, 28px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px), 28px); }
.notice { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; color: var(--muted); margin-bottom: 18px; }
.notice b { color: var(--ink); font-weight: 600; }
h1 { font: 600 26px/1.15 var(--font-head); margin: 0; text-wrap: balance; }
h2 { font: 600 16px/1.25 var(--font-head); margin: 0; letter-spacing: .01em; }
.head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; }
.sub { color: var(--muted); margin-top: 4px; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.panel > header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.panel > .body { padding: 14px 16px; }
.grid { display: grid; gap: 14px; }
.g-stats { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stat { padding: 12px 14px; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.stat:hover { border-color: var(--accent); }
.stat .v { font: 600 26px/1.1 var(--font-head); font-variant-numeric: tabular-nums; margin-top: 6px; }
.stat .v.money { font-size: 20px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap;
  color: var(--c, var(--idle)); background: color-mix(in srgb, var(--c, var(--idle)) 14%, transparent); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-instock { --c: var(--ok); } .s-assigned { --c: var(--accent); } .s-inrepair { --c: var(--warn); } .s-retired { --c: var(--idle); } .s-disposed { --c: var(--muted); }
.s-pending { --c: var(--warn); } .s-accepted { --c: var(--ok); } .s-disputed { --c: var(--bad); } .s-expired { --c: var(--idle); } .s-leaver { --c: var(--idle); } .s-overdue { --c: var(--bad); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
th button { all: unset; cursor: pointer; }
th button:focus-visible { outline: 2px solid var(--accent); }
tbody tr:last-child td { border-bottom: 0; }
tfoot td { font-weight: 600; background: var(--surface-2); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
a, .link { color: var(--accent); text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; }
a:hover, .link:hover { text-decoration: underline; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; min-width: 0; }

.btn { font: 500 13px var(--font-ui); border-radius: 6px; padding: 6px 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.btn.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 130px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13px; }

.list { display: grid; gap: 0; }

.list > div:last-child { border-bottom: 0; }
.empty { color: var(--muted); padding: 6px 0; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 20px; }

.tl { border-left: 2px solid var(--line); padding-left: 12px; position: relative; }

.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: min(420px, calc(100vw - 32px));

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const d = (iso) => (iso ? `${iso.slice(8, 10)}.${iso.slice(5, 7)}.${iso.slice(0, 4)}` : "—");

const nowIso = () => new Date().toISOString().slice(0, 19);

// ---- domain rules (mirror app/services) -------------------------------------
function monthsBetween(a, b) {
  const [y1, m1, d1] = a.split("-").map(Number), [y2, m2, d2] = b.split("-").map(Number);
  let m = (y2 - y1) * 12 + (m2 - m1); if (d2 < d1) m -= 1; return Math.max(m, 0);
}
const r2 = (x) => Math.round(x * 100) / 100;
function depreciation(a, asAt = TODAY) {
  if (a.cost == null || !a.purchased) return null;
  const c = category(a), life = c.life, residual = r2(a.cost * c.residual / 100);
  const monthly = (a.cost - residual) / life;
  const end = a.disposal?.disposed && a.disposal.disposed < asAt ? a.disposal.disposed : asAt;
  const months = Math.min(monthsBetween(a.purchased, end), life);
  const book = Math.max(a.cost - r2(monthly * months), residual);
  return { cost: a.cost, residual, monthly: r2(monthly), life, months, accumulated: r2(a.cost - book), book };
}
const ALLOWED = { "In Stock": ["Assigned", "In Repair", "Retired"], "Assigned": ["In Stock", "In Repair"],
  "In Repair": ["In Stock", "Assigned", "Retired"], "Retired": ["Disposed", "In Stock"], "Disposed": [] };
const openAssignment = (assetId) => D.assignments.find((x) => x.assetId === assetId && !x.in);
const openRepair = (assetId) => D.repairs.find((r) => r.assetId === assetId && !r.completed);
const isOverdue = (x) => { if (x.in) return false; if (x.expected && x.expected < TODAY) return true;
  const e = emps[x.employeeId]; return e.status === "LEAVER" && e.leaving && e.leaving < TODAY; };
function transition(a, to, action, note, employeeId = null) {
  if (!ALLOWED[a.status].includes(to)) throw new Error(`${a.tag} cannot move from ${a.status} to ${to}.`);
  log(a, action, note, { status: [a.status, to] }, employeeId);
  a.status = to;
}
function log(a, action, note, changes, employeeId = null) {
  D.audit.unshift({ at: nowIso(), user: action.startsWith("ack_") ? null : ME, type: "asset", label: a.tag,
    action, note, assetId: a.id, employeeId, changes });
}
const ops = {
  checkout(a, empId, expected, cond) {
    const e = emps[empId];
    if (a.status !== "In Stock") throw new Error(`Only In Stock assets can be checked out; ${a.tag} is ${a.status}.`);
    if (!e) throw new Error("Choose an employee.");
    if (e.status !== "ACTIVE") throw new Error(`${e.name} is a leaver and cannot receive assets.`);
    transition(a, "Assigned", "check_out", `Checked out to ${e.name} (${e.code})`, e.id);
    a.locationId = e.locationId;
    D.assignments.push({ id: nextId++, assetId: a.id, employeeId: e.id, out: nowIso(), expected: expected || null, condOut: cond,
      in: null, condIn: null, ack: { status: "Pending", sent: nowIso(), responded: null } });
    return `${a.tag} checked out to ${e.name}. Acknowledgement email logged for ${e.email}.`;
  },
  checkin(a, cond) {
    const x = openAssignment(a.id);
    if (!x) throw new Error(`${a.tag} is not checked out.`);
    if (a.status === "In Repair") throw new Error("Close the open repair before checking this asset in.");
    x.in = nowIso(); x.condIn = cond;
    const e = emps[x.employeeId];
    if (cond === "Damaged") {
      transition(a, "In Repair", "check_in", `Returned damaged by ${e.name}`, e.id);
      D.repairs.push({ id: nextId++, assetId: a.id, reported: TODAY, issue: "Returned damaged at check-in", type: "Internal", completed: null });
    } else transition(a, "In Stock", "check_in", `Returned by ${e.name} (${cond})`, e.id);
    return `${a.tag} checked in; now ${a.status}.`;
  },
  repair(a, issue, type) {
    if (!issue.trim()) throw new Error("Describe the issue.");
    transition(a, "In Repair", "repair_opened", issue);
    D.repairs.push({ id: nextId++, assetId: a.id, reported: TODAY, issue, type, completed: null });
    return `Repair opened; ${a.tag} is In Repair.`;
  },
  closeRepair(a, outcome, cost, resolution) {
    const r = openRepair(a.id);
    Object.assign(r, { completed: TODAY, outcome, cost: cost === "" ? null : Number(cost.replace(",", ".")), resolution });
    transition(a, openAssignment(a.id) ? "Assigned" : "In Stock", "repair_closed", `Repair closed: ${outcome}`);
    return outcome === "Beyond repair" ? `Repair closed as beyond repair. Retire ${a.tag} next.` : `Repair closed; ${a.tag} is ${a.status}.`;
  },
  retire(a, reason) {
    if (openAssignment(a.id)) throw new Error(`Check ${a.tag} in before retiring it.`);
    const r = openRepair(a.id); if (r) Object.assign(r, { completed: TODAY, outcome: "Beyond repair" });
    transition(a, "Retired", "retire", reason);
    a.disposal = { retired: TODAY, reason, disposed: null };
    return `${a.tag} retired.`;
  },
  dispose(a, method, wipe, confirmed, sale) {
    if (!confirmed) throw new Error("Confirm the data wipe before disposing of an asset.");
    transition(a, "Disposed", "dispose", method);
    Object.assign(a.disposal, { disposed: TODAY, method, wipe, wipeConfirmed: true, sale: sale ? Number(sale.replace(",", ".")) : null });
    return `${a.tag} disposed. The record is now read-only.`;
  },
  ack(a, accept) {
    const x = openAssignment(a.id), e = emps[x.employeeId];
    x.ack = { ...x.ack, status: accept ? "Accepted" : "Disputed", responded: nowIso(), typed: accept ? e.name : null,
      comment: accept ? null : "Not received yet, still at reception?" };
    log(a, accept ? "ack_accepted" : "ack_disputed", `${e.name} ${accept ? "accepted" : "disputed"} ${a.tag}`, null, e.id);
    return accept ? `${e.name} accepted ${a.tag}.` : `${e.name} reported a problem; IT notified.`;
  },
};

}

// ---- assets ----------------------------------------------------------------------
function filteredAssets() {
  const f = S.af, q = f.q.trim().toLowerCase();
  let rows = D.assets.filter((a) => (f.status ? a.status === f.status : a.status !== "Disposed"));
  if (f.cat) rows = rows.filter((a) => String(models[a.modelId].categoryId) === f.cat);
  if (f.loc) rows = rows.filter((a) => String(a.locationId) === f.loc);
  if (f.warranty === "expired") rows = rows.filter((a) => a.warranty && a.warranty < TODAY);
  else if (f.warranty === "none") rows = rows.filter((a) => !a.warranty);
  else if (f.warranty) rows = rows.filter((a) => a.warranty && a.warranty >= TODAY && a.warranty <= addDays(TODAY, Number(f.warranty)));
  if (q) rows = rows.filter((a) => { const x = openAssignment(a.id);
    return [a.tag, a.serial, modelName(a), x ? emps[x.employeeId].name : ""].some((s) => (s || "").toLowerCase().includes(q)); });
  const key = { tag: (a) => a.tag, model: modelName, status: (a) => a.status, location: (a) => locs[a.locationId]?.name ?? "",
    purchased: (a) => a.purchased ?? "", cost: (a) => a.cost ?? 0, warranty: (a) => a.warranty ?? "9999" }[f.sort];
  return rows.sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * f.dir; });
}
const opt = (v, label, cur) => `<option value="${esc(v)}" ${String(cur) === String(v) ? "selected" : ""}>${esc(label)}</option>`;
function sortTh(label, key, num = false) {
  const on = S.af.sort === key;
  return `<th class="${num ? "num" : ""}" ${on ? `aria-sort="${S.af.dir > 0 ? "ascending" : "descending"}"` : ""}><button data-sort="${key}">${label}${on ? (S.af.dir > 0 ? " ▲" : " ▼") : ""}</button></th>`;
}
function pager(total, page, size, ns) {
  const pages = Math.max(Math.ceil(total / size), 1);
  return `<div class="pager"><span>${total} result${total === 1 ? "" : "s"}${total ? ` · ${(page - 1) * size + 1}–${Math.min(page * size, total)}` : ""}</span>
    <span class="actions"><button class="btn" data-page="${ns}:${page - 1}" ${page <= 1 ? "disabled" : ""}>Previous</button><span style="align-self:center">${page} / ${pages}</span><button class="btn" data-page="${ns}:${page + 1}" ${page >= pages ? "disabled" : ""}>Next</button></span></div>`;
}
function assetList() {
  const f = S.af, rows = filteredAssets(), size = 25, page = Math.min(f.page, Math.max(Math.ceil(rows.length / size), 1));

    <div class="field"><label for="af-status">Status</label><select id="af-status" data-af="status">${opt("", "All except Disposed", f.status)}${STATUSES.map((s) => opt(s, s, f.status)).join("")}</select></div>
    <div class="field"><label for="af-cat">Category</label><select id="af-cat" data-af="cat">${opt("", "All", f.cat)}${D.categories.map((c) => opt(c.id, c.name, f.cat)).join("")}</select></div>
    <div class="field"><label for="af-loc">Location</label><select id="af-loc" data-af="loc">${opt("", "All", f.loc)}${D.locations.map((l) => opt(l.id, l.name, f.loc)).join("")}</select></div>
    <div class="field"><label for="af-w">Warranty</label><select id="af-w" data-af="warranty">${[["", "Any"], ["30", "Expires ≤ 30 days"], ["90", "Expires ≤ 90 days"], ["expired", "Expired"], ["none", "No warranty"]].map(([v, l]) => opt(v, l, f.warranty)).join("")}</select></div>

    return `<tr class="clickable" data-asset="${a.id}"><td class="mono"><b>${a.tag}</b></td><td>${esc(modelName(a))} <span class="muted" style="font-size:12px">${esc(category(a).name)}</span></td>
    <td class="mono">${esc(a.serial)}</td><td>${pill(a.status)}</td><td>${esc(locs[a.locationId]?.name ?? "—")}</td><td>${x ? esc(emps[x.employeeId].name) : '<span class="muted">—</span>'}</td>

  if (S.assetTab === "assignments") body = `<div class="table-wrap"><table><thead><tr><th>Employee</th><th>Checked out</th><th>Expected return</th><th>Condition out</th><th>Checked in</th><th>Condition in</th><th>Acknowledgement</th></tr></thead><tbody>

const REPORTS = [["inventory", "RPT-01 Inventory"], ["warranty", "RPT-03 Warranty"], ["aging", "RPT-04 Aging"], ["financial", "RPT-05 Depreciation"], ["disposals", "RPT-08 Disposal register"]];
function table(cols, rows, foot, numFrom = 1) {
  const td = (v, i) => `<td class="${i >= numFrom && (typeof v === "number" || /€|^\d/.test(String(v))) ? "num" : ""}">${v}</td>`;
  return `<div class="table-wrap"><table><thead><tr>${cols.map((c, i) => `<th class="${i >= numFrom ? "num" : ""}">${c}</th>`).join("")}</tr></thead><tbody>
    ${rows.map((r) => `<tr>${r.map(td).join("")}</tr>`).join("") || `<tr><td colspan="${cols.length}" class="empty">No rows.</td></tr>`}</tbody>
    ${foot ? `<tfoot><tr>${foot.map(td).join("")}</tr></tfoot>` : ""}</table></div>`;
}
const sum = (rows, i) => rows.reduce((t, r) => t + (typeof r[i] === "number" ? r[i] : 0), 0);
function reports() {
  const active = D.assets.filter((a) => ACTIVE.includes(a.status));
  let title = "", desc = "", controls = "", out = "";
  if (S.report === "inventory") {
    const st = STATUSES.slice(0, 4), g = S.group, m = {};
    D.assets.filter((a) => a.status !== "Disposed").forEach((a) => { const k = g === "category" ? category(a).name : locs[a.locationId]?.name ?? "—"; (m[k] ??= {})[a.status] = ((m[k] ?? {})[a.status] || 0) + 1; });
    const rows = Object.keys(m).sort().map((k) => [esc(k), ...st.map((s) => m[k][s] || 0), st.reduce((t, s) => t + (m[k][s] || 0), 0)]);
    title = "Inventory by status"; desc = "Asset counts per group and status, disposed assets excluded.";
    controls = `<div class="field"><label for="grp">Group by</label><select id="grp" data-group>${opt("location", "Location", g)}${opt("category", "Category", g)}</select></div>`;
    out = table([g === "category" ? "Category" : "Location", ...st, "Total"], rows, ["Total", ...st.map((_, i) => sum(rows, i + 1)), sum(rows, 5)]);
  } else if (S.report === "warranty") {
    const rows = active.filter((a) => !a.warranty || a.warranty <= addDays(TODAY, 90)).sort((a, b) => (a.warranty ?? "9999").localeCompare(b.warranty ?? "9999"))
      .map((a) => [`<button class="link mono" data-asset="${a.id}">${a.tag}</button>`, esc(modelName(a)), pill(a.status), esc(locs[a.locationId]?.name), d(a.warranty),
        a.warranty ? Math.round((new Date(a.warranty) - new Date(TODAY)) / 864e5) : "—", !a.warranty ? "No warranty" : a.warranty < TODAY ? "Expired" : "Expiring ≤ 90 days"]);
    title = "Warranty status"; desc = "Active assets with an expired warranty, one expiring within 90 days, or none recorded.";
    out = table(["Asset tag", "Model", "Status", "Location", "Warranty end", "Days left", "Bucket"], rows, null, 4);
  } else if (S.report === "aging") {
    const bands = ["0–1 y", "1–2 y", "2–3 y", "3–4 y", "4+ y"], m = {};
    active.forEach((a) => { const c = category(a).name, mo = monthsBetween(a.purchased, TODAY); m[c] ??= { b: [0, 0, 0, 0, 0], past: 0, cost: 0 };
      m[c].b[Math.min(Math.floor(mo / 12), 4)]++; if (mo >= category(a).life) { m[c].past++; m[c].cost += a.cost; } });
    const rows = Object.keys(m).sort().map((c) => [esc(c), ...m[c].b, m[c].b.reduce((x, y) => x + y, 0), m[c].past, eur(m[c].cost)]);
    title = "Asset aging and refresh planning"; desc = "Active assets per category by age since purchase, and the replacement cost of those past their useful life.";
    out = table(["Category", ...bands, "Total", "Past useful life", "Replacement cost"], rows,
      ["Total", ...bands.map((_, i) => sum(rows, i + 1)), sum(rows, 6), sum(rows, 7), eur(Object.values(m).reduce((t, x) => t + x.cost, 0))]);
  } else if (S.report === "financial") {
    const g = S.group, m = {};
    active.filter((a) => a.purchased <= S.asAt).forEach((a) => { const k = g === "category" ? category(a).name : locs[a.locationId]?.name ?? "—", x = depreciation(a, S.asAt);
      m[k] ??= [0, 0, 0, 0]; m[k][0]++; m[k][1] += x.cost; m[k][2] += x.accumulated; m[k][3] += x.book; });
    const keys = Object.keys(m).sort(), rows = keys.map((k) => [esc(k), m[k][0], eur(m[k][1]), eur(m[k][2]), eur(m[k][3])]);
    const tot = [0, 1, 2, 3].map((i) => keys.reduce((t, k) => t + m[k][i], 0));
    title = "Depreciation"; desc = "Straight-line cost, accumulated depreciation and book value of active assets as at a date.";
    controls = `<div class="field"><label for="grp">Group by</label><select id="grp" data-group>${opt("location", "Location", g)}${opt("category", "Category", g)}</select></div>
      <div class="field"><label for="rasat">As at</label><input type="date" id="rasat" value="${S.asAt}"></div>`;
    out = table([g === "category" ? "Category" : "Location", "Assets", "Total cost", "Accumulated depreciation", "Book value"], rows, ["Total", tot[0], eur(tot[1]), eur(tot[2]), eur(tot[3])]);
  } else {
    const rows = D.assets.filter((a) => a.disposal).sort((a, b) => b.disposal.retired.localeCompare(a.disposal.retired)).map((a) => [`<button class="link mono" data-asset="${a.id}">${a.tag}</button>`,
      esc(modelName(a)), pill(a.status), d(a.disposal.retired), esc(a.disposal.reason), d(a.disposal.disposed), esc(a.disposal.method ?? "—"), esc(a.disposal.wipe ?? "—"),
      a.disposal.disposed ? (a.disposal.wipeConfirmed ? "Yes" : "No") : "—", a.disposal.sale == null ? "—" : eur(a.disposal.sale)]);
    title = "Disposal register"; desc = "Retired and disposed assets with method, data-wipe method and confirmation.";
    out = table(["Asset tag", "Model", "Status", "Retired", "Reason", "Disposed", "Method", "Data wipe", "Wipe confirmed", "Sale value"], rows, null, 9);
  }
  return `<div class="head"><div><h1>Reports</h1><div class="sub">In the Flask app every report also exports to CSV and prints to PDF.</div></div></div>
  <section class="panel"><div class="tabs" role="tablist">${REPORTS.map(([k, l]) => `<button role="tab" data-report="${k}" aria-selected="${S.report === k}">${l}</button>`).join("")}</div>
  <div class="body"><h2>${title}</h2><p class="muted" style="margin:4px 0 12px">${desc}</p>${controls ? `<div class="filters" style="padding:0 0 12px">${controls}</div>` : ""}${out}</div></section>`;
}

// ---- audit -----------------------------------------------------------------------------
function auditLog() {
  const f = S.auf, q = f.q.trim().toLowerCase();
  const actions = [...new Set(D.audit.map((e) => e.action))].sort();
  const rows = D.audit.filter((e) => (!f.action || e.action === f.action) && (!q || (e.label || "").toLowerCase().includes(q) || (e.note || "").toLowerCase().includes(q)));
  const size = 50, page = Math.min(f.page, Math.max(Math.ceil(rows.length / size), 1));
  return `<div class="head"><div><h1>Audit log</h1><div class="sub">Append-only. Shown in Europe/Berlin time; stored in UTC.</div></div></div>
  <section class="panel"><div class="filters"><div class="field" style="flex:1 1 220px"><label for="au-q">Record or note</label><input id="au-q" data-auf="q" value="${esc(f.q)}" placeholder="e.g. IT-000042 or a name"></div>
    <div class="field"><label for="au-a">Action</label><select id="au-a" data-auf="action">${opt("", "All", f.action)}${actions.map((a) => opt(a, a.replace("_", " "), f.action)).join("")}</select></div></div>
  <div class="table-wrap"><table><thead><tr><th>When</th><th>User</th><th>Record</th><th>Action</th><th>Changes</th></tr></thead><tbody>
  ${rows.slice((page - 1) * size, page * size).map((e) => `<tr><td class="num" style="text-align:left">${dt(e.at)}</td><td>${esc(e.user ?? "Employee via link")}</td>
    <td>${e.assetId ? `<button class="link mono" data-asset="${e.assetId}" data-tab="history">${esc(e.label)}</button>` : esc(e.label)}</td>
    <td><span class="mono">${esc(e.action.replace("_", " "))}</span>${e.note ? `<div class="muted" style="font-size:12px">${esc(e.note)}</div>` : ""}</td>
    <td class="diff">${e.changes ? Object.entries(e.changes).map(([k, [o, n]]) => `${esc(k)}: <del>${esc(o ?? "∅")}</del> → <ins>${esc(n ?? "∅")}</ins>`).join("<br>") : ""}</td></tr>`).join("")}
  </tbody></table></div>${pager(rows.length, page, size, "auf")}</section>`;
}

// ---- dialogs for lifecycle actions ----------------------------------------------------
const dlg = document.getElementById("dlg");
const sel = (id, label, options) => `<div class="field"><label for="${id}">${label}</label><select id="${id}">${options.map((o) => `<option>${o}</option>`).join("")}</select></div>`;
function dialog(a, act) {
  const x = openAssignment(a.id);
  const forms = {
    checkout: ["Check out " + a.tag, "Check out & email employee", `<div class="field"><label for="d-emp">Employee</label><select id="d-emp" size="7">${D.employees.filter((e) => e.status === "ACTIVE")
      .sort((p, q) => p.name.localeCompare(q.name, "de")).map((e) => `<option value="${e.id}">${esc(e.name)} · ${e.code} · ${esc(locs[e.locationId]?.name)}</option>`).join("")}</select></div>
      <div class="field"><label for="d-exp">Expected return (loans only)</label><input type="date" id="d-exp"></div>${sel("d-cond", "Condition", ["Good", "New", "Fair"])}
      <p class="note">The employee gets a single-use acknowledgement link, valid for 7 days.</p>`],
    checkin: ["Check in " + a.tag, "Check in", `<p>Returning from <b>${x ? esc(emps[x.employeeId].name) : ""}</b>.</p>${sel("d-cond", "Condition on return", ["Good", "New", "Fair", "Damaged"])}<p class="note">“Damaged” sends the asset to In Repair.</p>`],
    repair: ["Open repair for " + a.tag, "Open repair", `<div class="field"><label for="d-issue">Issue</label><textarea id="d-issue" rows="2"></textarea></div>${sel("d-type", "Type", ["Warranty", "Paid", "Internal"])}`],
    closeRepair: ["Close repair", "Close repair", `<p class="note">${esc(openRepair(a.id)?.issue ?? "")}</p>${sel("d-out", "Outcome", ["Fixed", "Replaced", "Beyond repair"])}
      <div class="field"><label for="d-cost">Cost (€)</label><input id="d-cost" inputmode="decimal" placeholder="0,00"></div><div class="field"><label for="d-res">Resolution</label><input id="d-res"></div>`],
    retire: ["Retire " + a.tag, "Retire asset", `${x ? `<div class="alert">Assigned to ${esc(emps[x.employeeId].name)}. It must be checked in first, so this will be rejected.</div>` : ""}${sel("d-reason", "Reason", ["End of life", "Damaged beyond repair", "Lost", "Stolen", "Other"])}`],
    dispose: ["Dispose of " + a.tag, "Dispose", `${sel("d-method", "Method", ["Recycled", "Sold", "Donated", "Destroyed", "Returned to lessor"])}${sel("d-wipe", "Data-wipe method", ["NIST 800-88 purge", "Cryptographic erase", "Physical destruction", "Not applicable"])}
      <div class="field"><label for="d-sale">Sale value (€)</label><input id="d-sale" inputmode="decimal"></div><label class="check"><input type="checkbox" id="d-ok"> I confirm the data wipe is complete</label>`],
  };
  const [title, submit, fields] = forms[act];
  dlg.innerHTML = `<form method="dialog"><header><h2>${title}</h2></header><div class="fields">${fields}</div>
    <footer><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">${submit}</button></footer></form>`;
  dlg.querySelector("form").addEventListener("submit", (ev) => {
    if (ev.submitter?.value !== "ok") return;
    const v = (id) => dlg.querySelector("#" + id)?.value ?? "";
    try {
      const msg = { checkout: () => ops.checkout(a, Number(v("d-emp")), v("d-exp"), v("d-cond")), checkin: () => ops.checkin(a, v("d-cond")),
        repair: () => ops.repair(a, v("d-issue"), v("d-type")), closeRepair: () => ops.closeRepair(a, v("d-out"), v("d-cost"), v("d-res")),
        retire: () => ops.retire(a, v("d-reason")), dispose: () => ops.dispose(a, v("d-method"), v("d-wipe"), dlg.querySelector("#d-ok").checked, v("d-sale")) }[act]();
      toast(msg); S.assetTab = act === "checkout" || act === "checkin" ? "assignments" : act.includes("epair") ? "repairs" : "history";
    } catch (err) { ev.preventDefault(); toast(err.message, true); return; }
    render();
  });
  dlg.showModal();
}

// ---- events --------------------------------------------------------------------------
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-view],[data-view-link],[data-asset],[data-employee],[data-sort],[data-page],[data-tab-sel],[data-act],[data-report],[data-filter-status]");
  if (!t) return;
  if (t.dataset.view || t.dataset.viewLink) { ev.preventDefault(); return go(t.dataset.view || t.dataset.viewLink); }
  if (t.dataset.filterStatus) { S.af = { ...S.af, status: t.dataset.filterStatus, page: 1 }; return go("assets"); }
  if (t.dataset.asset) return openAsset(Number(t.dataset.asset), t.dataset.tab || "details");
  if (t.dataset.employee) return openEmployee(Number(t.dataset.employee));
  if (t.dataset.sort) { S.af.dir = S.af.sort === t.dataset.sort ? -S.af.dir : 1; S.af.sort = t.dataset.sort; return render(); }
  if (t.dataset.page) { const [ns, p] = t.dataset.page.split(":"); S[ns].page = Number(p); render(); return window.scrollTo?.(0, 0); }
  if (t.dataset.tabSel) { S.assetTab = t.dataset.tabSel; return render(); }
  if (t.dataset.report) { S.report = t.dataset.report; return go("reports", { report: t.dataset.report }); }
  if (t.dataset.act) {
    const a = assets[S.assetId];
    if (t.dataset.act.startsWith("ack")) { toast(ops.ack(a, t.dataset.act === "ackAccept")); return render(); }
    return dialog(a, t.dataset.act);
  }
});
function refocus(id) { const el = document.getElementById(id); if (el) { el.focus(); if (el.setSelectionRange && el.type !== "date") el.setSelectionRange(el.value.length, el.value.length); } }
document.addEventListener("input", (ev) => {
  const t = ev.target, ns = ["af", "ef", "auf", "xf"].find((k) => t.dataset[k] !== undefined);
  if (ns) { S[ns][t.dataset[ns]] = t.type === "checkbox" ? t.checked : t.value; if ("page" in S[ns]) S[ns].page = 1; render(); refocus(t.id); }
  else if (t.id === "asat" || t.id === "rasat") { if (t.value) { S.asAt = t.value; render(); refocus(t.id); } }
  else if (t.dataset.group !== undefined) { S.group = t.value; render(); }
});

let start = "dashboard";
try { const h = location.hash.slice(1); if (VIEWS.some(([k]) => k === h)) start = h; } catch (e) { /* no hash access */ }
go(start);
</script>
